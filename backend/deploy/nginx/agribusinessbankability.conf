# Nginx site config for agribusinessbankability.com
# Per docs/20_DEPLOYMENT_ARCHITECTURE.md. Install at
# /etc/nginx/sites-available/agribusinessbankability.com and symlink into
# sites-enabled, then `certbot --nginx -d agribusinessbankability.com -d www.agribusinessbankability.com`.

upstream abi_backend {
    server 127.0.0.1:8000;
}

upstream abi_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name agribusinessbankability.com www.agribusinessbankability.com;

    # Redirect all HTTP to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agribusinessbankability.com www.agribusinessbankability.com;

    # Managed by Certbot.
    ssl_certificate     /etc/letsencrypt/live/agribusinessbankability.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agribusinessbankability.com/privkey.pem;

    client_max_body_size 10m;

    # Django admin, API and OpenAPI schema/docs -> backend.
    location /api/ {
        proxy_pass http://abi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location /admin/ {
        proxy_pass http://abi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /srv/abi/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /srv/abi/backend/media/;
        expires 7d;
    }

    # Everything else -> Next.js frontend.
    location / {
        proxy_pass http://abi_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
