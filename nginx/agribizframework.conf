# nginx site config for agribizframework.com
#
# Install to: /etc/nginx/conf.d/agribizframework.conf
#
# Everything is served from one origin, so the browser makes no cross-origin
# requests and no CORS handling is load-bearing for the app to work:
#
#   /                -> Next.js SSR frontend (127.0.0.1:3000)
#   /api/            -> Django/gunicorn      (127.0.0.1:8000)
#   /django-admin/   -> Django/gunicorn      (127.0.0.1:8000)
#   /django-static/  -> Django admin/DRF-browsable-API assets from disk
#
# There is deliberately ONE server block listening on port 80. Do not add a
# separate http->https redirect block by hand: `certbot --nginx --redirect`
# rewrites this file to add the :443 block, the certificate paths and the
# redirect itself. Two overlapping :80 blocks would make nginx discard one,
# and a hand-written redirect could fire before a certificate exists.
#
# IMPORTANT (see docs/PRODUCTION_ARCHITECTURE.md "The 127.0.0.1 lesson"):
# once certbot has run, this file's :80 block ends with a catch-all
# `return 404;  # managed by Certbot` for any Host header it wasn't issued a
# certificate for -- so `curl http://127.0.0.1/` (Host: 127.0.0.1) is NOT a
# valid health check post-certbot. Always test with the real hostname:
#   curl --resolve agribizframework.com:443:127.0.0.1 https://agribizframework.com/

upstream agribiz_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream agribiz_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    # default_server also answers requests made directly to the server's IP
    # address, which is how the deployment is verified before DNS/certbot.
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name agribizframework.com www.agribizframework.com
                server1.agribizframework.com 66.29.139.201;

    access_log /var/log/nginx/agribiz-access.log;
    error_log  /var/log/nginx/agribiz-error.log;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Let certbot answer the HTTP-01 challenge from disk.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---------------------------------------------------------------- backend

    location /api/ {
        proxy_pass http://agribiz_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Django reads this to know the original request was HTTPS
        # (SECURE_PROXY_SSL_HEADER in config/settings/prod.py).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # PDF/CSV report generation (POST /api/v1/reports/) is synchronous
        # and can take a moment; stay under gunicorn's own 180s timeout
        # (deploy/gunicorn.conf.py).
        proxy_read_timeout 60s;
    }

    location /django-admin/ {
        proxy_pass http://agribiz_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # Django admin / DRF-spectacular docs assets, written here by
    # `manage.py collectstatic`.
    location /django-static/ {
        alias /srv/agribiz/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # --------------------------------------------------------------- frontend

    # Hashed Next.js build assets are immutable -- cache them hard.
    location /_next/static/ {
        proxy_pass http://agribiz_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The service worker must never be cached long-term, or a stale worker
    # can keep serving an old app shell indefinitely.
    location = /sw.js {
        proxy_pass http://agribiz_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://agribiz_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
