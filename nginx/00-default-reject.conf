# Catch-all for HTTPS requests to hostnames this server does not serve.
#
# Install to: /etc/nginx/conf.d/00-default-reject.conf
# (deploy/deploy.sh installs it on every run; it is never touched by certbot)
#
# Why this exists: any domain whose DNS points at this server's IP (for
# example, a third-party domain like codmtracker.com) used to get the ABI
# site served over HTTPS. nginx hands a request for an unknown name to the
# first server on that port, and certbot's :443 block in
# agribizframework.conf was the only one. Search engines then indexed the
# app under that other domain, and on it the browser showed "Not secure"
# (wrong certificate) and the app hung (its API calls are cross-origin).
#
# `ssl_reject_handshake on` refuses the TLS handshake for any SNI that does
# not match another server block's server_name, so no certificate is needed
# here and nothing is served. Needs nginx >= 1.19.4 (production has 1.20.1).
#
# Plain HTTP is already covered: after certbot runs, the :80 block in
# agribizframework.conf ends with `return 404` for unknown Host headers.
# This file deliberately does not listen on :80, because
# agribizframework.conf already holds `default_server` on :80 and two would
# make `nginx -t` fail.

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
}
